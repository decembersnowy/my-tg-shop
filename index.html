<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Mini App Shop</title>
    <!-- Подключаем официальный скрипт Telegram Web App -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            margin: 0; padding: 10px; box-sizing: border-box;
        }
        .currency-switcher {
            display: flex; justify-content: center; gap: 10px; margin-bottom: 15px;
        }
        .btn-currency {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            color: var(--tg-theme-button-text-color, #000);
            border: 1px solid #ccc; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .btn-currency.active {
            background: var(--tg-theme-button-color, #2481cc);
            color: #fff; border-color: transparent;
        }
        .products-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 70px;
        }
        .product-card {
            background: var(--tg-theme-secondary-bg-color, #f5f5f5);
            border-radius: 12px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-img {
            width: 100%; height: 120px; object-fit: cover; border-radius: 8px;
        }
        .product-title { font-size: 14px; margin: 8px 0 4px 0; font-weight: 600; }
        .product-price { font-size: 13px; color: var(--tg-theme-hint-color, #aaa); margin-bottom: 10px; }
        .btn-add {
            background: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; padding: 8px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer;
        }
        .counter { display: flex; justify-content: space-between; align-items: center; }
        .btn-count {
            background: #ccc; border: none; padding: 5px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Переключатель валюты -->
    <div class="currency-switcher">
        <button class="btn-currency active" id="btn-uzs" onclick="setCurrency('UZS')">UZS (сум)</button>
        <button class="btn-currency" id="btn-usd" onclick="setCurrency('USD')">USD ($)</button>
    </div>

    <!-- Сетка товаров -->
    <div class="products-grid" id="products"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        let currentCurrency = 'UZS';
        let cart = {};

        // ВАШ КАТАЛОГ ТОВАРОВ (Замените эти тестовые данные на свои 25-30 товаров)
        const products = [
            { id: 1, name: "RED STREET SWEATSHIRT", price_uzs: 650000, price_usd: 50, img: "https://kelme.com/cdn/shop/files/11425.jpg?v=1748001678&width=1000" },
            { id: 2, name: "MONTES YELLOW SWEATSHIRT", price_uzs: 180000, price_usd: 15, img: "https://kelme.com/cdn/shop/files/9569.jpg?v=1748005352&width=1000" },
            { id: 3, name: "NAVY LYNX LONG PANTS", price_uzs: 290000, price_usd: 22, img: "https://kelme.com/cdn/shop/files/3085.jpg?v=1748001775&width=600" },
            { id: 4, name: "BACKPACK", price_uzs: 350000, price_usd: 28, img: "https://kelme.com/cdn/shop/files/4603.jpg?v=1748003643&width=700" }
        ];

        function renderProducts() {
            const container = document.getElementById('products');
            container.innerHTML = '';
            
            products.forEach(p => {
                const count = cart[p.id] || 0;
                const priceText = currentCurrency === 'UZS' ? `${p.price_uzs.toLocaleString()} UZS` : `$${p.price_usd}`;
                
                let actionHtml = `<button class="btn-add" onclick="addToCart(${p.id})">В корзину</button>`;
                if (count > 0) {
                    actionHtml = `
                        <div class="counter">
                            <button class="btn-count" onclick="changeCount(${p.id}, -1)">-</button>
                            <span>${count}</span>
                            <button class="btn-count" onclick="changeCount(${p.id}, 1)">+</button>
                        </div>`;
                }

                container.innerHTML += `
                    <div class="product-card">
                        <img src="${p.img}" class="product-img">
                        <div class="product-title">${p.name}</div>
                        <div class="product-price">${priceText}</div>
                        ${actionHtml}
                    </div>`;
            });
            updateMainButton();
        }

        function setCurrency(currency) {
            currentCurrency = currency;
            document.getElementById('btn-uzs').classList.toggle('active', currency === 'UZS');
            document.getElementById('btn-usd').classList.toggle('active', currency === 'USD');
            cart = {}; // При смене валюты очищаем корзину, чтобы не путать расчеты
            renderProducts();
        }

        function addToCart(id) {
            cart[id] = 1;
            renderProducts();
        }

        function changeCount(id, delta) {
            cart[id] = (cart[id] || 0) + delta;
            if (cart[id] <= 0) delete cart[id];
            renderProducts();
        }

        // Кнопка самого Telegram внизу экрана
        function updateMainButton() {
            let total = 0;
            let itemsCount = 0;
            
            for (let id in cart) {
                const prod = products.find(p => p.id == id);
                total += cart[id] * (currentCurrency === 'UZS' ? prod.price_uzs : prod.price_usd);
                itemsCount += cart[id];
            }

            if (itemsCount > 0) {
                const totalText = currentCurrency === 'UZS' ? `${total.toLocaleString()} UZS` : `$${total}`;
                tg.MainButton.setText(`Оформить заказ: ${totalText}`);
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        // Передача данных из корзины в бот при нажатии кнопки «Оформить»
        tg.onEvent('mainButtonClicked', function() {
            const orderData = {
                currency: currentCurrency,
                items: cart
            };
            tg.sendData(JSON.stringify(orderData)); // Отправляем данные бэкенду
        });

        // Первичный запуск
        renderProducts();
    </script>
</body>
</html>
